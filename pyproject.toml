[project]
name = "triton-kernels"
version = "0.1.0"
description = "Hand-written Triton GPU kernels, tested against PyTorch and benchmarked."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "triton-windows; sys_platform == 'win32'",
    "triton; sys_platform == 'linux'",
    "pytest",
    "matplotlib",
    "pandas",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
